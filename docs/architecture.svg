<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="930" fill="#ffffff"/>
<text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">Scalable Web Application with ALB and Auto Scaling (AWS)</text>
<text x="30" y="54" font-size="12" fill="#475569">Region: us-east-1 | 2 Availability Zones | 3-tier: web / app / data</text>

<!-- edge -->
<rect x="380" y="70" width="160" height="34" rx="17" fill="#f1f5f9" stroke="#64748b"/><text x="460" y="92" font-size="13" text-anchor="middle">Users (Internet)</text>
<rect x="350" y="124" width="220" height="44" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="460" y="143" font-size="13" font-weight="bold" text-anchor="middle">Amazon Route 53</text><text x="460" y="159" font-size="11" text-anchor="middle" fill="#475569">alias app.domain → CloudFront</text>
<rect x="350" y="188" width="220" height="44" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="460" y="207" font-size="13" font-weight="bold" text-anchor="middle">Amazon CloudFront</text><text x="460" y="223" font-size="11" text-anchor="middle" fill="#475569">caches /static/* at the edge</text>
<rect x="350" y="252" width="220" height="30" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="460" y="272" font-size="13" text-anchor="middle">Internet Gateway</text>
<line x1="460" y1="104" x2="460" y2="124" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="168" x2="460" y2="188" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="232" x2="460" y2="252" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

<!-- VPC -->
<rect x="40" y="300" width="840" height="590" rx="10" fill="#fafaff" stroke="#8C4FFF" stroke-width="2"/>
<text x="54" y="320" font-size="13" font-weight="bold" fill="#6b21a8">VPC 10.0.0.0/16</text>
<rect x="60" y="330" width="390" height="545" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<rect x="470" y="330" width="390" height="545" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="255" y="347" font-size="12" text-anchor="middle" fill="#475569">Availability Zone A</text>
<text x="665" y="347" font-size="12" text-anchor="middle" fill="#475569">Availability Zone B</text>

<!-- public -->
<rect x="75" y="355" width="360" height="125" rx="6" fill="#ecfdf5" stroke="#3F8624"/><text x="85" y="371" font-size="11" fill="#166534">Public subnet 10.0.0.0/24</text>
<rect x="485" y="355" width="360" height="125" rx="6" fill="#ecfdf5" stroke="#3F8624"/><text x="835" y="371" text-anchor="end" font-size="11" fill="#166534">Public subnet 10.0.1.0/24</text>
<rect x="190" y="425" width="130" height="44" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="255" y="445" font-size="12" font-weight="bold" text-anchor="middle">NAT Gateway</text><text x="255" y="460" font-size="10" text-anchor="middle" fill="#475569">+ Elastic IP</text>
<rect x="600" y="425" width="130" height="44" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="665" y="445" font-size="12" font-weight="bold" text-anchor="middle">NAT Gateway</text><text x="665" y="460" font-size="10" text-anchor="middle" fill="#475569">+ Elastic IP</text>
<rect x="320" y="365" width="280" height="50" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="460" y="385" font-size="13" font-weight="bold" text-anchor="middle">Application Load Balancer</text><text x="460" y="402" font-size="11" text-anchor="middle" fill="#475569">Layer 7 rules + AWS WAF (OWASP, rate limit)</text>
<line x1="460" y1="282" x2="460" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

<!-- app tier -->
<rect x="75" y="500" width="360" height="150" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="85" y="516" font-size="11" fill="#1e3a8a">Private app subnet 10.0.10.0/24</text>
<rect x="485" y="500" width="360" height="150" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="495" y="516" font-size="11" fill="#1e3a8a">Private app subnet 10.0.11.0/24</text>
<rect x="110" y="525" width="700" height="110" rx="8" fill="none" stroke="#ED7100" stroke-width="2" stroke-dasharray="8 4"/>
<text x="460" y="542" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">Auto Scaling Group (min 2 / desired 2 / max 6) - Launch Template</text>
<rect x="155" y="560" width="200" height="62" rx="6" fill="#fff" stroke="#ED7100" stroke-width="2"/><text x="255" y="583" font-size="13" font-weight="bold" text-anchor="middle">EC2 web server</text><text x="255" y="600" font-size="11" text-anchor="middle" fill="#475569">Amazon Linux 2023 + nginx</text><text x="255" y="614" font-size="10" text-anchor="middle" fill="#475569">IMDSv2, no SSH</text>
<rect x="565" y="560" width="200" height="62" rx="6" fill="#fff" stroke="#ED7100" stroke-width="2"/><text x="665" y="583" font-size="13" font-weight="bold" text-anchor="middle">EC2 web server</text><text x="665" y="600" font-size="11" text-anchor="middle" fill="#475569">Amazon Linux 2023 + nginx</text><text x="665" y="614" font-size="10" text-anchor="middle" fill="#475569">IMDSv2, no SSH</text>
<line x1="410" y1="415" x2="275" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="415" x2="645" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

<!-- outbound via NAT -->
<path d="M200,560 L200,469" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>
<path d="M730,560 L730,469" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>
<path d="M215,425 L215,267 L350,267" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>
<path d="M705,425 L705,267 L570,267" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>

<!-- db tier -->
<rect x="75" y="675" width="360" height="185" rx="6" fill="#fdf2f8" stroke="#c026d3"/><text x="85" y="691" font-size="11" fill="#86198f">Private DB subnet 10.0.20.0/24 (isolated, no internet route)</text>
<rect x="485" y="675" width="360" height="185" rx="6" fill="#fdf2f8" stroke="#c026d3"/><text x="495" y="691" font-size="11" fill="#86198f">Private DB subnet 10.0.21.0/24 (isolated)</text>
<rect x="155" y="730" width="200" height="70" rx="6" fill="#fff" stroke="#c026d3" stroke-width="2"/><text x="255" y="755" font-size="13" font-weight="bold" text-anchor="middle">RDS PostgreSQL</text><text x="255" y="772" font-size="11" text-anchor="middle" fill="#475569">Primary (encrypted)</text><text x="255" y="787" font-size="10" text-anchor="middle" fill="#475569">Multi-AZ</text>
<rect x="565" y="730" width="200" height="70" rx="6" fill="#fff" stroke="#c026d3" stroke-width="2"/><text x="665" y="755" font-size="13" font-weight="bold" text-anchor="middle">RDS PostgreSQL</text><text x="665" y="772" font-size="11" text-anchor="middle" fill="#475569">Standby (automatic failover)</text>
<line x1="355" y1="765" x2="565" y2="765" stroke="#c026d3" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="460" y="757" font-size="10" text-anchor="middle" fill="#86198f">synchronous replication</text>
<line x1="255" y1="622" x2="255" y2="730" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<line x1="665" y1="622" x2="345" y2="730" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<text x="268" y="670" font-size="10" fill="#475569">PostgreSQL 5432</text>

<!-- right panel -->
<text x="1030" y="346" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Operations and security</text>
<rect x="910" y="360" width="240" height="56" rx="6" fill="#fff" stroke="#DD344C" stroke-width="2"/><text x="1030" y="383" font-size="12" font-weight="bold" text-anchor="middle">Systems Manager</text><text x="1030" y="400" font-size="11" text-anchor="middle" fill="#475569">Session Manager (no bastion)</text>
<rect x="910" y="436" width="240" height="56" rx="6" fill="#fff" stroke="#DD344C" stroke-width="2"/><text x="1030" y="459" font-size="12" font-weight="bold" text-anchor="middle">Secrets Manager</text><text x="1030" y="476" font-size="11" text-anchor="middle" fill="#475569">RDS master credentials</text>
<rect x="910" y="512" width="240" height="56" rx="6" fill="#fff" stroke="#E7157B" stroke-width="2"/><text x="1030" y="535" font-size="12" font-weight="bold" text-anchor="middle">CloudWatch</text><text x="1030" y="552" font-size="11" text-anchor="middle" fill="#475569">Dashboard + alarms (5xx, CPU, RDS)</text>
<rect x="910" y="598" width="240" height="56" rx="6" fill="#fff" stroke="#E7157B" stroke-width="2"/><text x="1030" y="621" font-size="12" font-weight="bold" text-anchor="middle">Amazon SNS</text><text x="1030" y="638" font-size="11" text-anchor="middle" fill="#475569">Email notifications</text>
<line x1="1030" y1="568" x2="1030" y2="598" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<rect x="910" y="684" width="240" height="56" rx="6" fill="#fff" stroke="#8C4FFF" stroke-width="2"/><text x="1030" y="707" font-size="12" font-weight="bold" text-anchor="middle">Route 53 health check</text><text x="1030" y="724" font-size="11" text-anchor="middle" fill="#475569">alias alb.domain → ALB /health</text>
<line x1="910" y1="388" x2="810" y2="580" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
<line x1="910" y1="464" x2="810" y2="600" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>

<!-- legend -->
<line x1="910" y1="790" x2="950" y2="790" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="960" y="794" font-size="11" fill="#334155">Request / data flow</text>
<line x1="910" y1="812" x2="950" y2="812" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/><text x="960" y="816" font-size="11" fill="#334155">Outbound via NAT / management</text>
<text x="910" y="846" font-size="10" fill="#64748b">Security Groups: ALB (80/443 from internet)</text>
<text x="910" y="860" font-size="10" fill="#64748b">→ App (80 from ALB) → DB (5432 from App).</text>
<text x="910" y="874" font-size="10" fill="#64748b">NACLs on every subnet tier.</text>
</svg>
